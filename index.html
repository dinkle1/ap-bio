<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Listening to the Brain — Brain-Computer Interfaces & Paralysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink: #04070e;
  --void: #07101e;
  --void-2: #0a1424;
  --panel: #0e1a2c;
  --line: rgba(190,210,255,0.08);
  --line-2: rgba(190,210,255,0.14);
  --text: #e6eef9;
  --mute: rgba(230,238,249,0.58);
  --mute-2: rgba(230,238,249,0.38);
  --electric: #4cf0ff;
  --signal: #6aa0ff;
  --signal-deep: #1d4cd9;
  --warn: #ffc266;
  --danger: #ff7a7a;
  --grid: rgba(108,160,255,0.07);
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --serif: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--void);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(76,240,255,0.07), transparent 70%),
    radial-gradient(900px 500px at 90% 30%, rgba(106,160,255,0.06), transparent 60%),
    var(--void);
  overflow-x: hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* Page grid background — subtle CS / lab notebook */
.page-grid{
  position: fixed; inset: 0; z-index: 0; pointer-events:none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 100%);
}

/* Type */
.eyebrow{
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--electric);
  display:inline-flex; align-items:center; gap:10px;
}
.eyebrow::before{
  content:""; width:18px; height:1px; background: currentColor;
  display:inline-block;
}
.display{
  font-family: var(--serif);
  font-weight: 700;
  line-height: 1.03;
  letter-spacing: -0.04em;
  color: var(--text);
}
.display em{ color: var(--electric); font-style: normal; font-weight: 300; letter-spacing: -0.02em; }
.display .muted{ color: var(--mute-2); font-weight: 300; }
.h2{
  font-family: var(--serif);
  font-size: clamp(40px, 5.5vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.035em;
  margin: 0;
  font-weight: 700;
}
.h2 em{ color: var(--electric); font-style: normal; font-weight: 300; }
.h3{
  font-family: var(--serif);
  font-size: clamp(28px, 3.2vw, 40px);
  line-height: 1.1;
  letter-spacing: -0.025em;
  margin: 0;
  font-weight: 600;
}
.body{
  font-size: 17px;
  line-height: 1.6;
  color: var(--mute);
  font-weight: 300;
}
.body strong{ color: var(--text); font-weight: 500; }
.lead{
  font-size: 20px;
  line-height: 1.55;
  color: var(--text);
  font-weight: 300;
  letter-spacing: -0.005em;
}
.mono{ font-family: var(--mono); font-size: 12px; letter-spacing: 0.02em; }

/* Layout helpers */
.container{ max-width: 1240px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 1; }
.section{ padding: 120px 0; position: relative; }
.section--compact{ padding: 80px 0; }
.divider{ height: 1px; background: linear-gradient(90deg, transparent, var(--line-2), transparent); }

/* Nav */
.nav{
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display:flex; align-items:center; justify-content:space-between;
  padding: 16px 32px;
  backdrop-filter: blur(20px) saturate(1.4);
  background: rgba(7,16,30,0.6);
  border-bottom: 1px solid var(--line);
  transition: background 0.3s ease, border-color 0.3s ease;
}
.nav__brand{ display:flex; align-items:center; gap:12px; font-family: var(--mono); font-size: 12px; letter-spacing:0.1em; }
.nav__brand .dot{ width:8px; height:8px; border-radius: 2px; background: var(--electric); box-shadow: 0 0 14px var(--electric); animation: pulseDot 2.4s ease-in-out infinite; }
@keyframes pulseDot{ 0%,100%{opacity:1} 50%{opacity:0.35} }
.nav__links{ display:flex; gap: 24px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute); }
.nav__links a{ transition: color 0.2s ease; }
.nav__links a:hover{ color: var(--electric); }
.nav__cta{ font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text); padding: 7px 14px; border:1px solid rgba(76,240,255,0.25); border-radius:999px; transition: border-color 0.2s ease, color 0.2s ease; }
.nav__cta:hover{ border-color: rgba(76,240,255,0.6); color: var(--electric); }

/* Pill / chip */
.chip{
  display:inline-flex; align-items:center; gap:8px;
  padding: 5px 12px; border:1px solid var(--line-2);
  border-radius: 999px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--mute);
  background: rgba(255,255,255,0.025);
  transition: border-color 0.2s ease, color 0.2s ease;
}
.chip:hover{ border-color: rgba(76,240,255,0.3); color: var(--text); }
.chip .dot{ width:5px; height:5px; border-radius:50%; background: var(--electric); box-shadow: 0 0 6px var(--electric); }

/* Cards & panels */
.panel{
  background: linear-gradient(160deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.005) 60%);
  border: 1px solid var(--line);
  border-radius: 16px;
  position: relative;
  box-shadow: 0 1px 0 0 rgba(255,255,255,0.04) inset;
}
.panel__chrome{
  display:flex; align-items:center; justify-content:space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; color: var(--mute);
  letter-spacing: 0.06em;
}
.panel__chrome-name{ display:flex; align-items:center; gap:10px; color: var(--text); }
.panel__chrome-name::before{ content:""; width:7px; height:7px; border-radius:50%; background: var(--electric); box-shadow: 0 0 8px var(--electric); }

/* Footnote ref */
.fn{
  display:inline-block; vertical-align: super;
  font-family: var(--mono); font-size: 10px;
  color: var(--electric); margin-left: 2px;
  cursor: pointer; opacity: 0.85;
}
.fn:hover{ opacity: 1; }

/* Pull quote */
.pullquote{
  font-family: var(--serif);
  font-size: clamp(26px, 2.8vw, 36px);
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: var(--text);
  padding: 24px 0 24px 28px;
  border-left: 2px solid var(--electric);
  margin: 0;
  font-style: normal;
  font-weight: 300;
}

/* canvas + svg defaults */
canvas{ display:block; }

/* selection */
::selection{ background: var(--electric); color: #001018; }

/* Scrollbar */
::-webkit-scrollbar{ width: 10px; height: 10px; }
::-webkit-scrollbar-track{ background: var(--void); }
::-webkit-scrollbar-thumb{ background: rgba(108,160,255,0.18); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover{ background: rgba(108,160,255,0.35); }

/* Reveal on scroll utility */
.reveal{ opacity: 0; transform: translateY(24px); transition: opacity .8s cubic-bezier(0.16,1,0.3,1), transform .8s cubic-bezier(0.16,1,0.3,1); }
.reveal.in{ opacity: 1; transform: translateY(0); }

/* Focus visible */
*:focus-visible{ outline: 2px solid var(--electric); outline-offset: 3px; border-radius: 3px; }

/* Boot */
#root:empty::after{
  content:""; position: fixed; inset: 0;
  background: var(--void);
}
</style>
</head>
<body>
  <div class="page-grid"></div>
  <div id="root"></div>

</body>
</html>
